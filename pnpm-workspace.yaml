packages:
  - 'apps/*'
  - 'packages/*'
  - 'spikes/*'

# Install scripts are denied by default (pnpm 10). Allow-list only what is needed:
# - esbuild: platform binary check used by tsx/vitest.
# - node-datachannel: WebTorrent v3 imports it at module load even though the
#   server disables WebRTC; it installs a prebuilt N-API binary.
# uTP / bufferutil / utf-8-validate stay unbuilt (optional, transports disabled).
onlyBuiltDependencies:
  - esbuild
  - node-datachannel
